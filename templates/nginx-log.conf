# /etc/nginx/nginx.conf の http {} 内に貼る (alp json 用)
# 元からある `access_log /var/log/nginx/access.log;` の行は消す (残すと 2 形式が混ざり alp が失敗する)
log_format json escape=json '{"time":"$time_iso8601",'
  '"host":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":"$status",'
  '"body_bytes":"$body_bytes_sent",'
  '"referer":"$http_referer",'
  '"ua":"$http_user_agent",'
  '"request_time":"$request_time",'
  '"response_time":"$upstream_response_time"}';
access_log /var/log/nginx/access.log json;

# upstream の keepalive (location で proxy_http_version 1.1; proxy_set_header Connection ""; も必要)
# upstream app { server 127.0.0.1:8080; keepalive 64; }

# nginx.conf の先頭 (http の外)
# worker_processes auto;
# worker_rlimit_nofile 100000;
# events { worker_connections 4096; }
